<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集團聯絡窗口資訊確認</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, onSnapshot, getDocs, updateDoc, deleteDoc, writeBatch, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // ==========================================
        // ⚠️ 重要：Firebase 設定
        // ==========================================
        const myFirebaseConfig = {
             apiKey: "AIzaSyAPfPZ0ZQCOLjdhyHqTpyLT8TgT791nUn8",
             authDomain: "contack-survey.firebaseapp.com",
             projectId: "contack-survey",
             storageBucket: "contack-survey.firebasestorage.app",
             messagingSenderId: "60043053915",
             appId: "1:60043053915:web:efc3624f8e9b9cb2cfa87e",
            measurementId: "G-3EF8B9GJ0W"
        };
        // ==========================================

        let rawData = [];
        let userActions = {};
        let fieldOrder = []; 
        let currentUser = null;
        let adminCreds = { user: "admin", pass: "8406" }; 
        let pendingDeleteId = null;
        let db, auth, appId;

        window.isAdminLoggedIn = false;
        window.currentAdminFilter = 'all';

        async function startSystem() {
            try {
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : myFirebaseConfig;
                
                // 修正處：根據您的 Firebase 實際路徑調整 appId
                appId = typeof __app_id !== 'undefined' ? __app_id : "survey-system-6d0ec"; 

                if (!firebaseConfig.apiKey) {
                    console.error("Firebase 未配置");
                    return;
                }

                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                };
                await initAuth();

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        currentUser = user;
                        await loadConfig();
                        listenToData();
                    }
                });
            } catch (err) { console.error("Init Error:", err); }
        }

        async function loadConfig() {
            if (!currentUser) return;
            try {
                // 指向正確的配置路徑
                const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'admin_config', 'settings');
                const configDoc = await getDoc(configRef);
                if (configDoc.exists()) {
                    adminCreds = configDoc.data();
                    console.log("管理員配置已從雲端更新");
                } else {
                    console.log("未找到雲端配置，使用預設帳密");
                }
            } catch(e) { console.error("Config Load Error:", e); }
        }

        function listenToData() {
            if (!currentUser) return;
            
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'raw_list'), (snap) => {
                rawData = snap.docs.map(d => ({ ...d.data(), _rowId: d.id }));
                if (rawData.length > 0) {
                    fieldOrder = rawData[0]._fieldOrder || Object.keys(rawData[0]).filter(k => !k.startsWith('_'));
                }
                updateUIOnDataChange();
            }, (err) => console.error("Listen raw_list error:", err));

            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'user_actions'), (snap) => {
                userActions = {};
                snap.forEach(d => { userActions[d.id] = d.data(); });
                updateUIOnDataChange();
            }, (err) => console.error("Listen user_actions error:", err));
        }

        function updateUIOnDataChange() {
            const taxId = document.getElementById('user-tax-id')?.value.trim();
            if (taxId) window.userSearch(true); 
            if (window.isAdminLoggedIn) window.refreshAdminTable();
        }

        window.switchTab = (tab) => {
            document.querySelectorAll('main > div').forEach(el => el.classList.add('hidden'));
            if (tab === 'user') {
                document.getElementById('section-user').classList.remove('hidden');
            } else {
                if (window.isAdminLoggedIn) {
                    document.getElementById('section-admin').classList.remove('hidden');
                    window.refreshAdminTable();
                } else {
                    document.getElementById('section-admin-login').classList.remove('hidden');
                }
            }
            // 更新按鈕樣式
            const userBtn = document.getElementById('tab-user');
            const adminBtn = document.getElementById('tab-admin');
            if (tab === 'user') {
                userBtn.className = 'px-6 py-2 rounded-lg font-bold text-orange-600 bg-white shadow-sm transition-all';
                adminBtn.className = 'px-6 py-2 rounded-lg font-bold text-stone-400 hover:text-orange-500 transition-all';
            } else {
                adminBtn.className = 'px-6 py-2 rounded-lg font-bold text-orange-600 bg-white shadow-sm transition-all';
                userBtn.className = 'px-6 py-2 rounded-lg font-bold text-stone-400 hover:text-orange-500 transition-all';
            }
        };

        window.userSearch = (isSilent = false) => {
            const taxId = document.getElementById('user-tax-id').value.trim();
            const container = document.getElementById('user-result-container');
            const submitArea = document.getElementById('final-submit-area');
            const addBtnArea = document.getElementById('add-contact-area');
            if (!taxId) return;

            const matches = rawData.filter(item => String(findTaxId(item)) === taxId && userActions[item._rowId]?.status !== 'deleted');
            const newContacts = Object.keys(userActions)
                .filter(id => {
                    const act = userActions[id];
                    return id.startsWith('new-') && act.status !== 'deleted' && String(findTaxId(act.data)) === taxId;
                })
                .map(id => ({ ...userActions[id].data, _rowId: id }));

            const finalDisplayList = [...matches, ...newContacts];

            if (finalDisplayList.length === 0) {
                if(!isSilent) {
                    container.innerHTML = '';
                    submitArea?.classList.add('hidden');
                    addBtnArea?.classList.add('hidden');
                    window.showModal('查無資料', '找不到此統編。', 'error');
                }
                return;
            }

            container.innerHTML = '';
            finalDisplayList.forEach((person, index) => {
                const rowId = person._rowId;
                const action = userActions[rowId];
                const currentData = action ? action.data : person;
                
                let sText = '待處理';
                if (action?.status === 'confirmed') {
                    const isModified = action.status === 'modified' || (action.original && JSON.stringify(action.data) !== JSON.stringify(action.original));
                    sText = isModified ? '已修改' : '已確認';
                }
                else if (action?.status === 'modified') sText = '已修改';
                else if (rowId.startsWith('new-')) sText = '全新新增';

                let sClass = (action?.status === 'confirmed') ? 'status-confirmed' : (action?.status === 'modified' ? 'status-modified' : 'status-none');
                let cClass = (action?.status === 'confirmed') ? 'card-confirmed' : (action?.status === 'modified' ? 'card-modified' : 'bg-white');
                
                const displayKeys = [...new Set([...fieldOrder, ...Object.keys(currentData)])].filter(k => !k.startsWith('_') && k !== 'undefined' && k !== '最後異動時間' && k !== '處理狀態');
                
                // 檢查是否勾選了指定訓練身分
                const isTrainingContactChecked = action?.trainingContact === true;
                const isTrainingSupervisorChecked = action?.trainingSupervisor === true;
                const isOtherSupervisorChecked = action?.otherSupervisor === true;

                const card = document.createElement('div');
                card.className = `${cClass} rounded-2xl shadow-sm border-2 border-orange-100 overflow-hidden mb-6 transition-all`;
                card.innerHTML = `
                    <div class="p-5 border-b border-orange-100 flex justify-between items-center bg-orange-50/50">
                        <div class="flex items-center gap-3">
                            <span class="w-8 h-8 bg-orange-500 text-white rounded-full flex items-center justify-center font-bold text-sm shadow-sm">${index + 1}</span>
                            <span class="font-bold text-stone-800 text-lg">${findContactName(currentData)}</span>
                        </div>
                        <span class="status-badge ${sClass}">${sText}</span>
                    </div>
                    <div class="p-0 overflow-x-auto">
                        <table class="w-full text-sm">
                            <tbody>
                                ${displayKeys.map(key => `
                                    <tr class="border-b border-orange-50 last:border-0 hover:bg-orange-50/30">
                                        <td class="p-3 w-1/3 bg-orange-50/30 font-bold text-stone-500 border-r border-orange-100">${key}</td>
                                        <td class="p-3 w-2/3">
                                            <span id="view-${rowId}-${key}">${currentData[key] || ''}</span>
                                            <input id="edit-${rowId}-${key}" type="text" value="${currentData[key] || ''}" class="hidden w-full border border-orange-200 rounded px-2 py-1 focus:ring-2 focus:ring-orange-300">
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                    <!-- 新增：訓練角色勾選區 -->
                    <div class="px-5 py-3 bg-orange-50/20 border-t border-orange-100 flex flex-wrap items-center gap-6 text-sm">
                        <div class="w-full mb-1">
                            <span class="font-bold text-stone-600">指定訓練身分設定：</span>
                            <span class="text-xs text-stone-500 ml-2">※ 選取為「訓練聯絡窗口與訓練負責主管者，為教育訓練相關資訊郵件收件對象。</span>
                        </div>
                        <label class="flex items-center gap-2 cursor-pointer hover:text-orange-600">
                            <input type="radio" name="role-${rowId}" value="contact" onchange="window.handleRoleChange('${rowId}')" ${isTrainingContactChecked ? 'checked' : ''} class="w-4 h-4 accent-orange-500 cursor-pointer">
                            <span class="font-medium">訓練聯絡窗口</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer hover:text-orange-600">
                            <input type="radio" name="role-${rowId}" value="supervisor" onchange="window.handleRoleChange('${rowId}')" ${isTrainingSupervisorChecked ? 'checked' : ''} class="w-4 h-4 accent-orange-500 cursor-pointer">
                            <span class="font-medium">訓練負責主管</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer hover:text-orange-600">
                            <input type="radio" name="role-${rowId}" value="other" onchange="window.handleRoleChange('${rowId}')" ${isOtherSupervisorChecked ? 'checked' : ''} class="w-4 h-4 accent-orange-500 cursor-pointer">
                            <span class="font-medium">其他主管</span>
                        </label>
                    </div>
                    <div class="p-4 bg-orange-50/30 flex justify-between items-center border-t border-orange-100">
                        <button onclick="window.requestDelete('${rowId}')" class="px-3 py-2 text-red-500 hover:bg-red-50 rounded-lg text-base font-bold">刪除</button>
                        <div class="flex gap-2">
                            <button onclick="window.confirmRow('${rowId}')" class="px-4 py-2 bg-green-600 text-white rounded font-bold text-sm shadow-md hover:bg-green-700">確認正確</button>
                            <button id="btn-edit-${rowId}" onclick="window.startEditRow('${rowId}')" class="px-4 py-2 bg-white border border-orange-200 text-stone-600 rounded text-sm shadow-sm hover:bg-orange-50">修改</button>
                            <button id="btn-save-${rowId}" onclick="window.saveRow('${rowId}')" class="hidden px-4 py-2 bg-orange-500 text-white rounded font-bold text-sm shadow-md hover:bg-orange-600">儲存</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            submitArea?.classList.remove('hidden');
            addBtnArea?.classList.remove('hidden');
        };

        window.openAddContact = () => {
            const taxId = document.getElementById('user-tax-id').value.trim();
            let base = rawData.find(item => String(findTaxId(item)) === taxId && userActions[item._rowId]?.status !== 'deleted');
            if (!base) {
                const anyNew = Object.values(userActions).find(a => a.status !== 'deleted' && String(findTaxId(a.data)) === taxId);
                if (anyNew) base = anyNew.data;
            }
            if(!base) return;

            const modal = document.getElementById('add-contact-modal');
            const formContainer = document.getElementById('add-contact-form-container');
            formContainer.innerHTML = '';
            const keys = [...new Set([...fieldOrder, ...Object.keys(base)])].filter(k => !k.startsWith('_') && k !== 'undefined');
            
            keys.forEach(key => {
                const isAutoFill = key.includes('統一編號') || key.includes('統編') || key.includes('名稱') || key.includes('公司') || key.includes('地址');
                const val = isAutoFill ? (base[key] || '') : '';
                
                const div = document.createElement('div');
                div.className = "mb-3";
                div.innerHTML = `
                    <label class="block text-xs font-bold text-stone-500 mb-1">${key}</label>
                    <input type="text" data-key="${key}" value="${val}" 
                        ${isAutoFill ? 'readonly class="w-full bg-orange-100 p-2 rounded text-sm border-0 text-stone-500 cursor-not-allowed"' : 'class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-orange-300 outline-none" placeholder="請輸入..."'}>
                `;
                formContainer.appendChild(div);
            });
            modal.classList.remove('hidden');
        };

        window.submitNewContact = async () => {
            if (!currentUser) return;
            const inputs = document.querySelectorAll('#add-contact-form-container input');
            const newData = {};
            inputs.forEach(input => { newData[input.getAttribute('data-key')] = input.value; });
            const rowId = `new-${Date.now()}`;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'user_actions', rowId), {
                status: 'new', data: newData, original: {}, timestamp: new Date().toLocaleString()
            });
            document.getElementById('add-contact-modal').classList.add('hidden');
        };

        window.handleRoleChange = async (rowId) => {
            if (!currentUser) return;
            const action = userActions[rowId];
            
            // 只有在狀態已經是「已確認」的情況下，更改身分才會立刻取消確認狀態
            if (action && action.status === 'confirmed') {
                const role = document.querySelector(`input[name="role-${rowId}"]:checked`)?.value;
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'user_actions', rowId), {
                    ...action,
                    status: 'modified',
                    trainingContact: role === 'contact',
                    trainingSupervisor: role === 'supervisor',
                    otherSupervisor: role === 'other',
                    timestamp: new Date().toLocaleString()
                });
            }
        };

        window.saveRow = async (rowId) => {
            if (!currentUser) return;
            const action = userActions[rowId];
            const item = rawData.find(r => r._rowId === rowId);
            const original = item || action?.original || {};
            const newData = {};
            const inputs = document.querySelectorAll(`input[id^="edit-${rowId}-"]`);
            
            inputs.forEach(input => { 
                const key = input.id.replace(`edit-${rowId}-`, '');
                newData[key] = input.value; 
            });
            
            const role = document.querySelector(`input[name="role-${rowId}"]:checked`)?.value;
            const trainingContact = role === 'contact';
            const trainingSupervisor = role === 'supervisor';
            const otherSupervisor = role === 'other';

            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'user_actions', rowId), {
                status: (rowId.startsWith('new-') ? 'new' : 'modified'), 
                data: newData, 
                original: original, 
                trainingContact: trainingContact,
                trainingSupervisor: trainingSupervisor,
                otherSupervisor: otherSupervisor,
                timestamp: new Date().toLocaleString()
            });
            
            Object.keys(newData).forEach(k => {
                const viewEl = document.getElementById(`view-${rowId}-${k}`);
                const editEl = document.getElementById(`edit-${rowId}-${k}`);
                if(viewEl) viewEl.classList.remove('hidden');
                if(editEl) editEl.classList.add('hidden');
            });
            document.getElementById(`btn-edit-${rowId}`)?.classList.remove('hidden');
            document.getElementById(`btn-save-${rowId}`)?.classList.add('hidden');
        };

        window.confirmRow = async (rowId) => {
            if (!currentUser) return;
            
            const firstEditInput = document.querySelector(`input[id^="edit-${rowId}-"]`);
            if (firstEditInput && !firstEditInput.classList.contains('hidden')) {
                window.showModal('請先儲存', '您已進行修改，請先點選「儲存」按鈕確認內容後，才能點選「確認正確」。', 'error');
                return;
            }

            // 取得目前的勾選狀態
            const role = document.querySelector(`input[name="role-${rowId}"]:checked`)?.value;
            const trainingContact = role === 'contact';
            const trainingSupervisor = role === 'supervisor';
            const otherSupervisor = role === 'other';

            if (!role) {
                window.showModal('身分未設定', '每個聯絡人請選擇一個身分設定別（三選一）。', 'error');
                return;
            }

            const item = rawData.find(r => r._rowId === rowId);
            const current = userActions[rowId]?.data || item || {};
            const original = item || userActions[rowId]?.original || {};
            
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'user_actions', rowId), {
                status: 'confirmed', 
                data: current, 
                original: original, 
                trainingContact: trainingContact,
                trainingSupervisor: trainingSupervisor,
                otherSupervisor: otherSupervisor,
                timestamp: new Date().toLocaleString()
            });
        };

        window.finalSubmitSurvey = () => {
            const taxId = document.getElementById('user-tax-id').value.trim();
            if(!taxId) return;

            const matches = rawData.filter(item => String(findTaxId(item)) === taxId && userActions[item._rowId]?.status !== 'deleted');
            const newContacts = Object.keys(userActions)
                .filter(id => {
                    const act = userActions[id];
                    return id.startsWith('new-') && act.status !== 'deleted' && String(findTaxId(act.data)) === taxId;
                });

            const allContactIds = [...matches.map(m => m._rowId), ...newContacts];
            
            // 檢查是否每個聯絡人皆已確認
            const allConfirmed = allContactIds.every(id => userActions[id]?.status === 'confirmed');

            if (!allConfirmed) {
                window.showModal('提示', '請先確保所有聯絡人均已點選「確認正確」（且已勾選對應的訓練角色）。', 'error');
                return;
            }

            // 額外檢查：整個統編底下，是否至少有一個「訓練聯絡窗口」以及一個「訓練負責主管」被勾選
            let hasContactWindow = false;
            let hasSupervisor = false;
            allContactIds.forEach(id => {
                const act = userActions[id];
                if (act?.trainingContact) hasContactWindow = true;
                if (act?.trainingSupervisor) hasSupervisor = true;
            });

            if (!hasContactWindow || !hasSupervisor) {
                window.showModal('角色配置不完整', '送出前請確保該公司至少指派了一位「訓練聯絡窗口」以及一位「訓練負責主管」。', 'error');
                return;
            }

            window.showModal('已完成', '感謝您的確認，資料已即時存入雲端並更新查核進度。', 'success');
        };

        window.startEditRow = (rowId) => {
            const item = userActions[rowId]?.data || rawData.find(r => r._rowId === rowId);
            Object.keys(item).filter(k => !k.startsWith('_')).forEach(k => {
                document.getElementById(`view-${rowId}-${k}`)?.classList.add('hidden');
                document.getElementById(`edit-${rowId}-${k}`)?.classList.remove('hidden');
            });
            document.getElementById(`btn-edit-${rowId}`).classList.add('hidden');
            document.getElementById(`btn-save-${rowId}`).classList.remove('hidden');
        };

        window.attemptLogin = () => {
            const u = document.getElementById('admin-user').value;
            const p = document.getElementById('admin-pass').value;
            if (u === adminCreds.user && p === adminCreds.pass) {
                window.isAdminLoggedIn = true;
                window.switchTab('admin');
            } else {
                window.showModal('錯誤', '帳號或密碼不正確', 'error');
            }
        };

        window.confirmDeleteAction = async () => {
            if (!pendingDeleteId || !currentUser) return;
            const rowId = pendingDeleteId;
            document.getElementById('delete-confirm-modal').classList.add('hidden');
            const original = rawData.find(r => r._rowId === rowId) || userActions[rowId]?.original || {};
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'user_actions', rowId), {
                status: 'deleted', data: original, original: original, timestamp: new Date().toLocaleString()
            });
            pendingDeleteId = null;
        };

        window.requestDelete = (rowId) => {
            pendingDeleteId = rowId;
            document.getElementById('delete-confirm-modal').classList.remove('hidden');
        };

        window.exportToExcel = () => {
            const exportData = [];
            rawData.forEach(item => {
                const action = userActions[item._rowId];
                let final = item, st = '未處理';
                let tContact = action?.trainingContact ? '是' : '否';
                let tSupervisor = action?.trainingSupervisor ? '是' : '否';
                let oSupervisor = action?.otherSupervisor ? '是' : '否';
                if (action) {
                    if (action.status === 'deleted') { st = '已刪除'; } 
                    else {
                        final = action.data;
                        const isModified = (action.status === 'modified' || (action.original && JSON.stringify(action.data) !== JSON.stringify(action.original)));
                        if (action.status === 'confirmed') { st = isModified ? '已修改' : '已確認'; } 
                        else { st = isModified ? '已修改' : '查核中'; }
                    }
                }
                const row = {};
                fieldOrder.forEach(k => row[k] = final[k] !== undefined ? final[k] : "");
                row["訓練聯絡窗口"] = tContact;
                row["訓練負責主管"] = tSupervisor;
                row["其他主管"] = oSupervisor;
                row["處理狀態"] = st; 
                row["最後異動時間"] = action ? action.timestamp : "";
                exportData.push(row);
            });
            Object.keys(userActions).filter(id => id.startsWith('new-')).forEach(id => {
                const a = userActions[id];
                if (a.status === 'deleted') return;
                const row = {};
                fieldOrder.forEach(k => row[k] = a.data[k] !== undefined ? a.data[k] : "");
                row["訓練聯絡窗口"] = a.trainingContact ? '是' : '否';
                row["訓練負責主管"] = a.trainingSupervisor ? '是' : '否';
                row["其他主管"] = a.otherSupervisor ? '是' : '否';
                row["處理狀態"] = a.status === 'confirmed' ? "新增(已確認)" : "全新新增"; 
                row["最後異動時間"] = a.timestamp;
                exportData.push(row);
            });
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "查核結果");
            XLSX.writeFile(wb, `查核結果.xlsx`);
        };

        window.handleFileUpload = async (e) => {
            if (!currentUser) return;
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = async (evt) => {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                const ws = workbook.Sheets[workbook.SheetNames[0]];
                const range = XLSX.utils.decode_range(ws['!ref']);
                const headers = [];
                for (let C = range.s.c; C <= range.e.c; ++C) {
                    const addr = XLSX.utils.encode_col(C) + "1";
                    if(ws[addr]) headers.push(ws[addr].v);
                }
                window.showModal('處理中', `導入 ${json.length} 筆...`, 'loading');
                for (let i = 0; i < json.length; i++) {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'raw_list', `row-${Date.now()}-${i}`), { ...json[i], _fieldOrder: headers });
                }
                window.showModal('成功', `導入完成`, 'success');
            };
            reader.readAsArrayBuffer(file);
        };

        window.confirmClearData = async () => {
            if (!window.confirm("確定清空所有資料？") || !currentUser) return;
            window.showModal('處理中', '正在清空資料...', 'loading');
            const rawSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'raw_list'));
            const actionSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'user_actions'));
            const deleteDocs = async (snap) => {
                let batch = writeBatch(db), count = 0;
                for (const d of snap.docs) {
                    batch.delete(d.ref); count++;
                    if (count === 400) { await batch.commit(); batch = writeBatch(db); count = 0; }
                }
                if (count > 0) await batch.commit();
            };
            await deleteDocs(rawSnap); await deleteDocs(actionSnap);
            window.showModal('成功', '資料已清除。', 'success');
        };

        window.setAdminFilter = (val) => {
            window.currentAdminFilter = val;
            window.refreshAdminTable();
        };

        window.refreshAdminTable = () => {
            const tbody = document.getElementById('admin-status-table');
            if(!tbody) return; 
            tbody.innerHTML = '';
            const groupsMap = {};
            rawData.forEach(item => {
                const tid = String(findTaxId(item));
                if(!groupsMap[tid]) groupsMap[tid] = { taxId: tid, name: findName(item), count: 0, completed: 0 };
                const action = userActions[item._rowId];
                if (action?.status === 'deleted') return;
                groupsMap[tid].count++; 
                if(action?.status === 'confirmed') groupsMap[tid].completed++;
            });
            Object.keys(userActions).filter(id => id.startsWith('new-')).forEach(id => {
                const a = userActions[id];
                if (a.status === 'deleted') return;
                const tid = String(findTaxId(a.data));
                if(!groupsMap[tid]) groupsMap[tid] = { taxId: tid, name: findName(a.data), count: 0, completed: 0 };
                groupsMap[tid].count++; 
                if(a.status === 'confirmed') groupsMap[tid].completed++;
            });
            const filteredData = Object.values(groupsMap).filter(g => {
                const isDone = g.completed === g.count && g.count > 0;
                if (window.currentAdminFilter === 'done') return isDone;
                if (window.currentAdminFilter === 'pending') return !isDone;
                return true;
            });
            filteredData.sort((a,b)=>a.taxId.localeCompare(b.taxId)).forEach(g => {
                const tr = document.createElement('tr');
                let isDone = g.completed === g.count && g.count > 0;
                tr.className = "hover:bg-stone-50 transition-colors";
                tr.innerHTML = `
                    <td class="p-4 font-mono text-xs border-b">${g.taxId}</td>
                    <td class="p-4 text-xs border-b font-medium">${g.name}</td>
                    <td class="p-4 text-center text-xs font-bold text-orange-600 border-b">${g.completed} / ${g.count}</td>
                    <td class="p-4 border-b"><span class="status-badge ${isDone ? 'status-confirmed' : 'status-modified'}">${isDone ? '已完成' : '查核中'}</span></td>
                `;
                tbody.appendChild(tr);
            });
        };

        function findTaxId(obj) { return obj[Object.keys(obj).find(k => k.includes('統一編號') || k.includes('統編'))] || ''; }
        function findName(obj) { return obj[Object.keys(obj).find(k => k.includes('名稱') || k.includes('公司'))] || ''; }
        function findContactName(obj) { return obj[Object.keys(obj).find(k => k.includes('聯絡人') || k.includes('姓名'))] || '聯絡窗口'; }
        
        window.closeModal = () => document.getElementById('custom-modal').classList.add('hidden');
        window.closeAddModal = () => document.getElementById('add-contact-modal').classList.add('hidden');
        window.closeDeleteModal = () => document.getElementById('delete-confirm-modal').classList.add('hidden');
        window.showModal = (title, text, type) => {
            const m = document.getElementById('custom-modal');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-text').textContent = text;
            const iconWrap = document.getElementById('modal-icon');
            iconWrap.innerHTML = type === 'loading' ? '<span class="animate-spin inline-block w-8 h-8 border-4 border-orange-500 border-t-transparent rounded-full"></span>' : (type === 'success' ? '✅' : '❌');
            m.classList.remove('hidden');
        };

        window.onload = startSystem;
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #fffaf5; }
        .status-badge { padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: bold; white-space: nowrap; }
        .status-none { background: #fed7aa; color: #9a3412; }
        .status-confirmed { background: #bbf7d0; color: #166534; }
        .status-modified { background: #fde047; color: #854d0e; }
        .card-confirmed { background-color: #f0fdf4 !important; }
        .card-modified { background-color: #fefce8 !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #ed8936; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen pb-20 text-stone-800">
    <nav class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-orange-100 h-20">
        <div class="max-w-6xl mx-auto px-4 h-full flex items-center justify-between">
            <h1 class="font-bold text-2xl text-orange-900 tracking-tight">集團聯絡窗口資訊確認</h1>
            <div class="flex bg-stone-100 p-1 rounded-xl">
                <button onclick="switchTab('user')" id="tab-user" class="px-6 py-2 rounded-lg font-bold text-orange-600 bg-white shadow-sm transition-all">查核介面</button>
                <button onclick="switchTab('admin')" id="tab-admin" class="px-6 py-2 rounded-lg font-bold text-stone-400 hover:text-orange-500 transition-all">後台管理</button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-10">
        <div id="section-user">
            <div class="bg-white rounded-2xl shadow-lg p-10 mb-8 text-center border border-orange-100">
                <h2 class="text-xl font-bold mb-6 text-stone-600">請輸入公司統一編號開始查核</h2>
                <div class="flex gap-3 max-w-md mx-auto">
                    <input type="text" id="user-tax-id" maxlength="8" class="flex-1 border-2 border-orange-100 p-4 rounded-2xl text-center font-mono text-2xl focus:border-orange-500 outline-none transition-all" placeholder="8位統編">
                    <button onclick="userSearch()" class="bg-orange-500 text-white px-8 rounded-2xl font-bold hover:bg-orange-600 shadow-lg shadow-orange-200 transition-all">查詢</button>
                </div>
            </div>
            <div id="user-result-container"></div>
            <div id="add-contact-area" class="hidden text-center mb-8">
                <button onclick="openAddContact()" class="bg-white border-2 border-dashed border-orange-300 text-orange-600 px-8 py-4 rounded-2xl font-bold hover:bg-orange-50 transition-all shadow-sm">+ 新增聯絡窗口</button>
            </div>
            <div id="final-submit-area" class="hidden text-center">
                <button onclick="finalSubmitSurvey()" class="bg-orange-500 text-white px-12 py-4 rounded-full font-bold shadow-xl hover:scale-105 transition-transform">確認無誤並提交</button>
            </div>
        </div>

        <div id="section-admin-login" class="hidden max-w-sm mx-auto mt-20 p-10 bg-white rounded-3xl shadow-2xl border border-orange-50">
            <div class="text-center mb-8">
                <div class="inline-block p-4 bg-orange-100 rounded-2xl mb-4 text-3xl">🔑</div>
                <h3 class="font-bold text-2xl">管理員登入</h3>
            </div>
            <input type="text" id="admin-user" placeholder="帳號" class="w-full border p-4 rounded-xl mb-4 focus:ring-2 focus:ring-orange-300 outline-none">
            <input type="password" id="admin-pass" placeholder="密碼" class="w-full border p-4 rounded-xl mb-6 focus:ring-2 focus:ring-orange-300 outline-none">
            <button onclick="attemptLogin()" class="w-full bg-stone-800 text-white py-4 rounded-xl font-bold hover:bg-stone-900 transition-all shadow-lg">進入管理系統</button>
        </div>

        <div id="section-admin" class="hidden">
            <div class="flex flex-col lg:flex-row gap-8">
                <aside class="lg:w-1/4 space-y-6">
                    <div class="bg-white p-6 rounded-2xl border border-orange-100 shadow-sm">
                        <h3 class="font-bold mb-4 text-stone-500 text-sm flex items-center gap-2">
                            <span class="w-2 h-2 bg-orange-500 rounded-full"></span>數據工具
                        </h3>
                        <input type="file" id="up-in" class="hidden" onchange="handleFileUpload(event)">
                        <button onclick="document.getElementById('up-in').click()" class="w-full bg-orange-500 text-white py-3 rounded-xl font-bold mb-3 hover:bg-orange-600 transition-colors shadow-sm">導入原始資料 (Excel)</button>
                        <button onclick="exportToExcel()" class="w-full bg-stone-100 text-stone-700 py-3 rounded-xl font-bold mb-6 hover:bg-stone-200 transition-colors">匯出查核結果 (Excel)</button>
                        <hr class="mb-6">
                        <button onclick="confirmClearData()" class="w-full text-red-400 text-xs hover:text-red-600 font-medium transition-colors">⚠️ 清空所有資料</button>
                    </div>
                </aside>

                <section class="lg:w-3/4">
                    <div class="bg-white rounded-3xl border border-orange-100 shadow-sm overflow-hidden">
                        <div class="p-6 bg-stone-50/50 border-b flex flex-col sm:flex-row justify-between items-center gap-4">
                            <h3 class="font-bold text-lg text-stone-700">各公司進度監控</h3>
                            <div class="flex items-center gap-3">
                                <span class="text-xs font-bold text-stone-400">狀態篩選</span>
                                <select onchange="setAdminFilter(this.value)" class="text-sm border-2 border-stone-200 rounded-xl px-4 py-2 bg-white focus:border-orange-500 outline-none transition-all">
                                    <option value="all">全部進度</option>
                                    <option value="pending">查核中 (未完成)</option>
                                    <option value="done">已完成 (全數確認)</option>
                                </select>
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-sm text-left">
                                <thead class="bg-stone-50 text-stone-400 uppercase tracking-wider">
                                    <tr>
                                        <th class="p-4 font-bold border-b">統一編號</th>
                                        <th class="p-4 font-bold border-b">公司名稱</th>
                                        <th class="p-4 text-center font-bold border-b">進度</th>
                                        <th class="p-4 font-bold border-b">狀態</th>
                                    </tr>
                                </thead>
                                <tbody id="admin-status-table" class="divide-y divide-stone-100"></tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <!-- Modals -->
    <div id="custom-modal" class="fixed inset-0 bg-stone-900/40 z-[300] hidden flex items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-white rounded-3xl max-w-xs w-full p-8 text-center shadow-2xl scale-in">
            <div id="modal-icon" class="text-5xl mb-4"></div>
            <h3 id="modal-title" class="font-bold mb-2 text-xl"></h3>
            <p id="modal-text" class="text-stone-400 text-sm mb-8 leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full bg-stone-800 text-white py-3 rounded-2xl font-bold hover:bg-stone-900 transition-all shadow-md">確定</button>
        </div>
    </div>
    
    <div id="add-contact-modal" class="fixed inset-0 bg-stone-900/40 z-[101] hidden flex items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-white rounded-3xl max-md w-full p-8 flex flex-col max-h-[85vh] shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-bold text-2xl text-stone-700">新增聯絡窗口</h3>
                <button onclick="closeAddModal()" class="text-stone-300 hover:text-stone-600 text-2xl">&times;</button>
            </div>
            <div id="add-contact-form-container" class="overflow-y-auto flex-1 pr-3"></div>
            <div class="grid grid-cols-2 gap-4 mt-8">
                <button onclick="closeAddModal()" class="py-3 border-2 border-stone-100 rounded-2xl font-bold text-stone-400 hover:bg-stone-50 transition-all">取消</button>
                <button onclick="submitNewContact()" class="py-3 bg-orange-500 text-white rounded-2xl font-bold shadow-lg shadow-orange-100 hover:bg-orange-600 transition-all">確認儲存</button>
            </div>
        </div>
    </div>

    <div id="delete-confirm-modal" class="fixed inset-0 bg-stone-900/40 z-[200] hidden flex items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-white rounded-3xl max-sm w-full p-8 text-center shadow-2xl border-b-4 border-red-500">
            <div class="text-red-500 text-5xl mb-4">⚠️</div>
            <h3 class="font-bold mb-3 text-red-600 text-xl">確定刪除此聯絡人？</h3>
            <div class="grid grid-cols-2 gap-4 mt-6">
                <button onclick="closeDeleteModal()" class="border-2 border-stone-100 p-3 rounded-2xl font-bold text-stone-400">返回</button>
                <button onclick="confirmDeleteAction()" class="bg-red-500 text-white p-3 rounded-2xl font-bold">確認刪除</button>
            </div>
        </div>
    </div>
</body>
</html>
